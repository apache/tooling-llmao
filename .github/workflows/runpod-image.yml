name: RunPod image

# Builds hosting/runpod and pushes it to ghcr.io, tagged with the commit.
# Nothing uses the new image until an admin points the RunPod template at it:
# the run summary gives the digest-pinned reference to paste there.

on:
  push:
    branches: [main]
    paths:
      - 'hosting/runpod/**'
      - '.github/workflows/runpod-image.yml'
  workflow_dispatch:

permissions: {}

# Two pushes in quick succession build in order rather than racing.
concurrency:
  group: runpod-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    # The first push copies the vLLM base layers into ghcr once; later pushes
    # add only our small layer.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/apache/tooling-llmao/llmao-vllm-box
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # The docker-container driver is what can build COPY --link layers on a
      # base it never unpacks, and push straight to the registry.
      - name: Build and push
        run: |
          docker buildx create --driver docker-container --use
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false --sbom=false \
            --push \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            --tag "$IMAGE:$GITHUB_SHA" \
            hosting/runpod

      - name: Report the pinned reference
        run: |
          digest=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/meta.json")
          {
            echo "### RunPod image"
            echo
            echo "Paste into the RunPod template's container image:"
            echo
            echo '```'
            echo "$IMAGE@$digest"
            echo '```'
            echo
            echo "Built from $GITHUB_SHA (also tagged \`$IMAGE:$GITHUB_SHA\`)."
          } >> "$GITHUB_STEP_SUMMARY"
