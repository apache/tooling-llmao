# llmao GPU model-host stack.
#
# Topology (Option A — one vLLM server per model, litellm routes by name):
#
#   Apache vhost (host :443)  ->  llmao (:8080, CPU)
#                                    |
#                                 litellm-proxy (:4000, CPU)
#                    +---------------+---------------+
#                    |               |               |
#              vllm-gemma       vllm-qwen-coder   vllm-qwen8b
#              (:8001, GPU)     (:8002, GPU)      (:8003, GPU)
#
# All containers share the llmao-net bridge and resolve each other by name.
# Only llmao is fronted externally (via the host Apache reverse proxy);
# litellm and the vLLM servers bind to the internal network only.
#
# The three vLLM servers share one L40S (48GB). --gpu-memory-utilization is
# capped per model so they co-reside. Tune the caps against real VRAM use.

x-vllm-common: &vllm-common
  image: vllm/vllm-openai:v0.19.1   # >=0.11.0 required for Qwen3.x / Gemma-4 architectures (older images fail with 'architecture not recognized')
  restart: unless-stopped
  networks: [llmao-net]
  volumes:
    - hf-cache:/root/.cache/huggingface
  environment:
    - HF_TOKEN=${HF_TOKEN}
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  ipc: host   # vLLM needs this for its shared-memory tensor ops

services:
  # --- Gateway (CPU) ---------------------------------------------------
  llmao:
    image: llmao:latest          # built from the llmao repo (make build)
    restart: unless-stopped
    networks: [llmao-net]
    ports:
      - "127.0.0.1:8080:8080"    # loopback only; host Apache vhost fronts it
    # Provide a real config.yaml (litellm.mode=proxy, master_key, blank TLS
    # certs for HTTP behind the host Apache vhost). Example only ships in image.
    volumes:
      - llmao-state:/var/opt/llmao-state
      - ${LLMAO_CONFIG:-./config.yaml}:/app/config.yaml:ro
    depends_on: [litellm-proxy]

  # --- litellm proxy (CPU) --------------------------------------------
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    networks: [llmao-net]
    # Loopback-only bind so the host Apache vhost can front it for
    # machine-to-machine callers.
    #
    # Provision a per-caller virtual key rather than handing out the master
    # key, so usage is attributable and revocable:
    #   curl -X POST http://127.0.0.1:4000/key/generate \
    #     -H "Authorization: Bearer $LLMAO_LITELLM_MASTER_KEY" \
    #     -d '{"models":["selfhost/qwen3-8b","selfhost/gemma4-26b"],
    #          "key_alias":"gofannon-asvs"}'
    ports:
      - "100.105.28.100:4000:4000"
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    volumes:
      - /etc/llmao/litellm-config.yaml:/etc/litellm/config.yaml:ro
    environment:
      # Self-host base URLs — one per vLLM server (Option A).
      - LLMAO_SELFHOST_GEMMA_URL=http://vllm-gemma:8001/v1
      - LLMAO_SELFHOST_QWEN_CODER_URL=http://vllm-qwen-coder:8002/v1
      - LLMAO_SELFHOST_QWEN8B_URL=http://vllm-qwen8b:8003/v1
      - LLMAO_SELFHOST_API_KEY=${LLMAO_SELFHOST_API_KEY:-not-required}
      # Admin master key (team/key provisioning + spend).
      - LLMAO_LITELLM_MASTER_KEY=${LLMAO_LITELLM_MASTER_KEY}
      # Postgres backing store — REQUIRED for team/budget/key/spend features
      # (litellm returns 500 "No db connected" on /team/new without it).
      - DATABASE_URL=postgresql://litellm:${LLMAO_DB_PASSWORD:-litellm}@litellm-db:5432/litellm
      - STORE_MODEL_IN_DB=True
    depends_on: [vllm-gemma, vllm-qwen-coder, vllm-qwen8b, litellm-db]

  # --- litellm backing database (Postgres) ----------------------------
  # litellm stores teams, virtual keys, budgets, and spend logs here. Without
  # it, admin endpoints like /team/new fail with 500 "No db connected".
  litellm-db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [llmao-net]
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LLMAO_DB_PASSWORD:-litellm}
      - POSTGRES_DB=litellm
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- vLLM: Gemma 4 26B-A4B (general/multimodal/agentic) --------------
  vllm-gemma:
    <<: *vllm-common
    command: >
      --model RedHatAI/gemma-4-26B-A4B-it-FP8-Dynamic
      --served-model-name gemma4-26b
      --port 8001
      --gpu-memory-utilization 0.38
      --max-model-len 32768
      --quantization fp8

  # --- vLLM: Qwen 3.6-27B (coding) -------------------------------------
  vllm-qwen-coder:
    <<: *vllm-common
    command: >
      --model Qwen/Qwen3.6-27B
      --served-model-name qwen3.6-27b
      --port 8002
      --gpu-memory-utilization 0.38
      --max-model-len 32768
      --quantization fp8

  # --- vLLM: Qwen3-8B (fast) -------------------------------------------
  vllm-qwen8b:
    <<: *vllm-common
    command: >
      --model Qwen/Qwen3-8B-FP8
      --served-model-name qwen3-8b
      --port 8003
      --gpu-memory-utilization 0.18
      --max-model-len 32768
      --quantization fp8

networks:
  llmao-net:
    name: llmao-net
    driver: bridge

volumes:
  hf-cache:
    name: llmao-hf-cache
  litellm-db-data:
    name: llmao-litellm-db-data
  llmao-state:
    name: llmao-state