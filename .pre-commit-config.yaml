# Vendored bootstrap assets: never rewrite them.
exclude: ^static/

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-toml
    - id: check-yaml
    # PEM and SSH key material, wherever it is pasted (certs/ is gitignored, but a
    # key can still end up in a script or a config).
    - id: detect-private-key
    - id: end-of-file-fixer
    - id: mixed-line-ending
    - id: trailing-whitespace
- repo: https://github.com/Lucas-C/pre-commit-hooks
  rev: v1.5.6
  hooks:
    - id: insert-license
      name: Add license for all Python files
      files: ^((llmao|tests|bin|hosting|analysis)/.*\.py$|api\.py$|main\.py$|pages\.py$)
      args:
        - --comment-style
        - "|#|"
        - --license-filepath
        - LICENSE-template.txt
        - --fuzzy-match-generates-todo
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
    - id: shellcheck
- repo: https://github.com/woodruffw/zizmor-pre-commit
  rev: v1.22.0
  hooks:
    - id: zizmor
      args: [ --min-severity, low ]
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.9.26
  hooks:
    - id: uv-lock
- repo: local
  hooks:
    # Over the whole tree rather than the staged files: the scripts with a uv
    # shebang are not identified as Python here, and ruff's extend-include in
    # pyproject.toml is what knows them. Ruff is fast enough for that.
    - id: ruff
      name: Ruff Linter
      entry: uv run ruff check --fix .
      language: system
      pass_filenames: false
      always_run: true
    - id: ruff-format
      name: Ruff Formatter
      entry: uv run ruff format .
      language: system
      pass_filenames: false
      always_run: true
    # The suite is fast, but not as fast as the hooks above, so it runs on push
    # rather than every commit. Enable it with `prek install --hook-type pre-push`.
    - id: pytest
      name: Run the test suite
      entry: uv run pytest -q
      language: system
      stages: [pre-push]
      pass_filenames: false
      always_run: true
