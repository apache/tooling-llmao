[project]
name = "llmao"
version = "0.1.0"
description = "Thin litellm-proxy gateway fronted by asfquart for the ASF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "quart>=0.19",
    "httpx>=0.27",  # async LiteLLM admin client (ProxyBackend)
    "asfquart",
    "litellm[proxy,extra-proxy]",  # proxy stack + prisma (DB client)
    "PyYAML>=6.0.1",  # model_list.yaml / config loading
    "easydict>=1.13",  # APP.cfg dotted access / tests
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmao"]

[tool.pytest.ini_options]
testpaths = ["tests"]
